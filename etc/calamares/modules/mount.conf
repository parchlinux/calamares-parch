#
# Mount filesystems in the target (generally, before treating the
# target as a usable chroot / "live" system).
---
setSELinux: false

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSwapSubvol: /@swap

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/tmp
      subvolume: /@tmp

mountOptions:
    - filesystem: default
      options: [ noatime ]
    - filesystem: efi
      options: [ fmask=0137, dmask=0027 ]
    - filesystem: btrfs
      options: [ noatime, compress=zstd ]
      ssdOptions: [ discard=async ]
      hddOptions: [ autodefrag ]
    - filesystem: btrfs_swap
      options: [ noatime ]
