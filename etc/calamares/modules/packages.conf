#This file is part of calamares installer for Parch Linux
---
backend: pacman

skip_if_no_internet: false
update_db: false
update_system: false

num_retries: 0
disable_download_timeout: false
needed_only: false


operations:
  - try_remove:
    - calamares
    - calamares-parch
    - calamares-parch-beta
    - parchlinux-cala-config
    - parch-welcome
    - parch-dorood
    - parch-livecd-config
    - parch-live-config
    - livecd-sounds
    - mkinitcpio-archiso
    - arch-install-scripts
    - clonezilla
    - darkhttpd
    - grml-zsh-config
    - memtest86+
    - edk2-shell
