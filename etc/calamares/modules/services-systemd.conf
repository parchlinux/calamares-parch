#
# services-systemd.conf — explicitly enable the units at install time.
# Calamares' services-systemd module enables these deterministically.
---
units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false

   - name: "sshd"
     action: "enable"
     mandatory: false

   - name: "named"
     action: "enable"
     mandatory: false

   - name: "auditd"
     action: "enable"
     mandatory: false