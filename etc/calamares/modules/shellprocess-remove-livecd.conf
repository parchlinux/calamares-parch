#
# Configuration for the shell process job.

i18n:
     name: "Finalizing your installation"

dontChroot: false
timeout: 20
script:
    - "-rm -rf /etc/sudoers.d/g_wheel"
    - "-rm -rf /etc/systemd/system/getty@tty1.service.d"
    - "-rm -rf /root/.automated_script.sh"
    - "-rm -rf /root/.zlogin"
    - "-rm -rf /etc/plasmalogin.conf.d/autologin.conf"
    - "-rm -rf /etc/sddm.conf.d/autologin.conf"
    - "-mv -f /etc/kde_settings.conf /etc/sddm.conf.d/kde_settings.conf"
    #- "-rm @@ROOT@@/home/*/*/calamares.desktop"
