#
# shellprocess-crypt-root.conf — guarantee the LUKS kernel cmdline the way
# archinstall does it (deterministic, not dependent on grubcfg detection):
#     GRUB_CMDLINE_LINUX="cryptdevice=UUID=<luks>:root root=/dev/mapper/root"
# All real logic is in /etc/calamares/scripts/crypt-root.sh (a plain helper
# file) so this config carries NO variables — the calamares variable guard
# rejects any $var token in here.
# Runs INSIDE the target (dontChroot: false), after grubcfg, before the
# final grub-mkconfig so the resulting grub.cfg carries the LUKS params.
---
dontChroot: false
timeout: 300
script:
  - |
    python3 - <<'PY'
    import os, subprocess, sys

    root_src = ""
    try:
        root_src = subprocess.check_output(["findmnt", "-n", "-o", "SOURCE", "/"], text=True).strip()
    except Exception as e:
        print(f"crypt-root: could not get root source: {e}", file=sys.stderr)
        sys.exit(0)

    luks_dev = ""
    if root_src.startswith("/dev/mapper/"):
        try:
            sub = subprocess.check_output(["lsblk", "-no", "PKNAME", root_src], text=True).strip().splitlines()[0]
            if sub:
                luks_dev = f"/dev/{sub}"
        except Exception:
            pass

    if not luks_dev:
        try:
            res = subprocess.check_output(["blkid", "-s", "TYPE", "-o", "value", root_src], text=True).strip()
            if res == "crypto_LUKS":
                luks_dev = root_src
        except Exception:
            pass

    # Only proceed when backing device is crypto_LUKS
    if not luks_dev:
        print("crypt-root: root is not on an encrypted device — nothing to do")
        sys.exit(0)

    try:
        dev_type = subprocess.check_output(["blkid", "-s", "TYPE", "-o", "value", luks_dev], text=True).strip()
        if dev_type != "crypto_LUKS":
            print("crypt-root: root backing device is not crypto_LUKS — nothing to do")
            sys.exit(0)
    except Exception:
        print("crypt-root: could not verify device type — nothing to do")
        sys.exit(0)

    try:
        luks_uuid = subprocess.check_output(["blkid", "-s", "UUID", "-o", "value", luks_dev], text=True).strip()
    except Exception as e:
        print(f"crypt-root: could not get UUID: {e}", file=sys.stderr)
        sys.exit(1)

    cryptdev = f"cryptdevice=UUID={luks_uuid}:root root=/dev/mapper/root"
    grub_path = "/etc/default/grub"
    lines = []
    if os.path.exists(grub_path):
        with open(grub_path, "r") as f:
            lines = [line for line in f if not line.startswith("GRUB_CMDLINE_LINUX=")]
    lines.append(f'GRUB_CMDLINE_LINUX="{cryptdev}"\n')

    with open(grub_path, "w") as f:
        f.writelines(lines)

    print(f'crypt-root: GRUB_CMDLINE_LINUX="{cryptdev}"')
    PY