#
# shellprocess_copy_kernel.conf
# Copy kernel, initramfs, and CPU microcode into target /boot
# Supports standard archiso bootmnt layout and copy-to-ram mode.

---
dontChroot: true
timeout: 300
script:
  - |
    python3 - <<'PY'
    import os, shutil, subprocess, sys

    target_boot = "@@ROOT@@/boot"
    os.makedirs(target_boot, exist_ok=True)

    # 1. Copy Kernel (vmlinuz-linux)
    # launch.sh dynamically patches this path to /usr/lib/modules/$KERNEL/vmlinuz in copytoram mode
    vmlinuz_src = "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux"
    if not os.path.exists(vmlinuz_src):
        for cand in [
            "/run/archiso/bootmnt/arch/boot/vmlinuz-linux",
            "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz",
        ]:
            if os.path.exists(cand):
                vmlinuz_src = cand
                break

    # Fallback to running live kernel modules (copy-to-ram aware)
    if not os.path.exists(vmlinuz_src):
        try:
            kver = subprocess.check_output(["uname", "-r"], text=True).strip()
            cand = f"/usr/lib/modules/{kver}/vmlinuz"
            if os.path.exists(cand):
                vmlinuz_src = cand
        except Exception:
            pass

    if os.path.exists(vmlinuz_src):
        shutil.copy2(vmlinuz_src, os.path.join(target_boot, "vmlinuz-linux"))
        print(f"copy_kernel: copied kernel from {vmlinuz_src} to {target_boot}/vmlinuz-linux")
    else:
        print(f"copy_kernel: warning, kernel image not found (tried {vmlinuz_src})", file=sys.stderr)

    # 2. Copy Initramfs (if present on media; otherwise generated by initramfs-build)
    initramfs_src = "/run/archiso/bootmnt/arch/boot/x86_64/initramfs-linux.img"
    if not os.path.exists(initramfs_src):
        for cand in [
            "/run/archiso/bootmnt/arch/boot/initramfs-linux.img",
            "/run/archiso/copytoram/initramfs-linux.img",
            "/boot/initramfs-linux.img",
        ]:
            if os.path.exists(cand):
                initramfs_src = cand
                break

    if os.path.exists(initramfs_src):
        shutil.copy2(initramfs_src, os.path.join(target_boot, "initramfs-linux.img"))
        print(f"copy_kernel: copied initramfs from {initramfs_src} to {target_boot}/initramfs-linux.img")
    else:
        print("copy_kernel: initramfs not on media; will be built by initramfs-build")

    # 3. Copy CPU Microcode (amd-ucode.img, intel-ucode.img)
    for ucode in ["amd-ucode.img", "intel-ucode.img"]:
        ucode_src = f"/run/archiso/bootmnt/arch/boot/{ucode}"
        if not os.path.exists(ucode_src):
            for cand in [
                f"/run/archiso/bootmnt/arch/boot/x86_64/{ucode}",
                f"/run/archiso/copytoram/{ucode}",
                f"/boot/{ucode}",
            ]:
                if os.path.exists(cand):
                    ucode_src = cand
                    break

        if os.path.exists(ucode_src):
            shutil.copy2(ucode_src, os.path.join(target_boot, ucode))
            print(f"copy_kernel: copied {ucode} from {ucode_src} to {target_boot}/{ucode}")
        else:
            print(f"copy_kernel: {ucode} not present on media (skipped)")
    PY
