#
# shellprocess-grub-mkconfig.conf — regenerate grub.cfg AFTER grubcfg has
# written GRUB_ENABLE_CRYPTODISK=y + the cryptdevice/root cmdline.
# grub-install must run BEFORE GRUB_ENABLE_CRYPTODISK is set (it fails with
# exit 1 otherwise); the calamares bootloader module runs install+mkconfig
# before grubcfg, so we rebuild the config here so grub.cfg contains
# cryptomount + the LUKS kernel params.
# Runs INSIDE the target (dontChroot: false). No shell variables.
---
dontChroot: false
timeout: 300
script:
  - "grub-mkconfig -o /boot/grub/grub.cfg"