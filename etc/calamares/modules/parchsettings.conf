---
# Starting values for the Parch Settings page. Every switch starts from
# these values and writes the current selection to GlobalStorage under
# the `parchSettings` map. The target modules (migration, hwclock,
# systuner, zramcfg) read that map at exec time; a missing map or key
# keeps the behavior below.
qmlSearch: both
defaults:
    # Import user data (documents, downloads, pictures, music and browser
    # bookmarks) from a previously installed OS on this machine. The
    # per-folder selection is done on the user page; turning this off
    # skips the migration assistant entirely.
    migration: true
    # Hardware clock handling when Windows is (or was) installed:
    #   auto      - keep Windows dual-boot detection (localtime)
    #   localtime - always run the hardware clock in local time
    #   utc       - always run the hardware clock in UTC
    windowsRtc: "auto"
    # Detect small / HiDPI displays and pre-configure display scaling.
    hidpi: true
    # Limit battery charging to `chargeLimit` percent to extend battery
    # life on devices that expose a charge threshold.
    batteryGuard: true
    chargeLimit: 80
    # Provide compressed RAM swap (zram) when no disk swap is configured.
    zram: true
