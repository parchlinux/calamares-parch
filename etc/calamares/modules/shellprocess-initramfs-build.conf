#
# shellprocess-initramfs-build.conf — guarantee a usable /boot + initramfs
# for the LUKS root, instead of relying on the initcpio module alone.
# Runs INSIDE the target (dontChroot: false):
#   1. ensure /boot exists (kernel lands here; ext4 single-partition keeps
#      /boot inside the encrypted root, which GRUB unlocks via cryptodisk)
#   2. rewrite /etc/mkinitcpio.conf so the `encrypt` hook is present
#      (placed right before `filesystems` so LUKS is opened before mount)
#   3. regenerate the initramfs explicitly
# No shell variables (calamares variable guard).
---
dontChroot: false
timeout: 600
script:
  - |
    set -eu
    mkdir -p /boot
    python3 - <<'PY'
    import re
    p = "/etc/mkinitcpio.conf"
    s = open(p).read()
    m = re.search(r'HOOKS=\(([^)]*)\)', s)
    if m and "encrypt" not in m.group(1):
        hooks = m.group(1).split()
        if "filesystems" in hooks:
            i = hooks.index("filesystems")
        else:
            i = len(hooks)
        hooks.insert(i, "encrypt")
        s = s[:m.start(1)] + " ".join(hooks) + s[m.end(1):]
        open(p, "w").write(s)
    PY
    mkinitcpio -P
    ls -l /boot/vmlinuz-linux /boot/initramfs-linux.img 2>/dev/null || ls -l /boot