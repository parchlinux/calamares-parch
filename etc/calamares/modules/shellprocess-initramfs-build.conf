#
# shellprocess-initramfs-build.conf — guarantee a usable /boot + initramfs
# for the LUKS root, instead of relying on the initcpio module alone.
# Runs INSIDE the target (dontChroot: false):
#   1. ensure /boot exists
#   2. remove archiso drop-in configs from live medium
#   3. restore standard linux.preset for installed system
#   4. rewrite /etc/mkinitcpio.conf to remove live-only hooks and add `encrypt`
#   5. regenerate the initramfs explicitly
---
dontChroot: false
timeout: 600
script:
  - |
    set -eu
    mkdir -p /boot

    # Remove live ISO mkinitcpio drop-in configs
    rm -f /etc/mkinitcpio.conf.d/archiso.conf

    # Restore standard installed linux.preset
    cat <<'EOF' > /etc/mkinitcpio.d/linux.preset
    # mkinitcpio preset file for the 'linux' package
    ALL_config="/etc/mkinitcpio.conf"
    ALL_kver="/boot/vmlinuz-linux"

    PRESETS=('default' 'fallback')

    default_image="/boot/initramfs-linux.img"
    fallback_image="/boot/initramfs-linux-fallback.img"
    fallback_options="-S autodetect"
    EOF

    # Clean HOOKS and MODULES in /etc/mkinitcpio.conf
    python3 - <<'PY'
    import re, subprocess

    # Detect if root is on an encrypted (LUKS) device
    is_luks = False
    try:
        root_src = subprocess.check_output(["findmnt", "-n", "-o", "SOURCE", "/"], text=True).strip()
        if root_src.startswith("/dev/mapper/"):
            sub = subprocess.check_output(["lsblk", "-no", "PKNAME", root_src], text=True).strip().splitlines()[0]
            backing = f"/dev/{sub}" if sub else root_src
            btype = subprocess.check_output(["blkid", "-s", "TYPE", "-o", "value", backing], text=True).strip()
            if btype == "crypto_LUKS":
                is_luks = True
        elif subprocess.check_output(["blkid", "-s", "TYPE", "-o", "value", root_src], text=True).strip() == "crypto_LUKS":
            is_luks = True
    except Exception:
        pass

    p = "/etc/mkinitcpio.conf"
    s = open(p).read()

    # Clean HOOKS
    m = re.search(r'HOOKS=\(([^)]*)\)', s)
    if m:
        archiso_hooks = {"memdisk", "archiso", "archiso_loop_mnt", "archiso_pxe_common",
                         "archiso_pxe_nbd", "archiso_pxe_http", "archiso_pxe_nfs"}
        
        # Strip live-only hooks
        hooks = [h for h in m.group(1).split() if h not in archiso_hooks]

        # Ensure keyboard is present before block/filesystems
        if "keyboard" not in hooks:
            idx = hooks.index("block") if "block" in hooks else 0
            hooks.insert(idx, "keyboard")

        # Handle encrypt hook conditionally
        if is_luks:
            if "encrypt" not in hooks:
                idx = hooks.index("filesystems") if "filesystems" in hooks else len(hooks)
                hooks.insert(idx, "encrypt")
        else:
            hooks = [h for h in hooks if h != "encrypt"]

        s = s[:m.start(1)] + " ".join(hooks) + s[m.end(1):]

    # Clean MODULES: remove obsolete crc32c-intel / crc32c that cause mkinitcpio errors
    m_mod = re.search(r'MODULES=\(([^)]*)\)', s)
    if m_mod:
        legacy_crc = {"crc32c-intel", "crc32c_intel", "crc32c"}
        mods = [mod for mod in m_mod.group(1).split() if mod not in legacy_crc]
        s = s[:m_mod.start(1)] + " ".join(mods) + s[m_mod.end(1):]

    open(p, "w").write(s)
    PY

    mkinitcpio -P
    ls -l /boot/vmlinuz-linux /boot/initramfs-linux.img 2>/dev/null || ls -l /boot