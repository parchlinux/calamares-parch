#
# grubcfg.conf — writes /etc/default/grub on the installed target (runs
# before the bootloader module).
#
# always_use_defaults MUST stay on: with it off (and overwrite/prefer_grub_d
# false) the module never writes its CALCULATED LUKS kernel params, so the
# installed system boots without cryptdevice= / rd.luks.uuid= and falls into
# an emergency shell ("can't mount root"). With it on, the module computes:
#   - GRUB_ENABLE_CRYPTODISK=y                 (LUKS root -> GRUB can unlock)
#   - GRUB_CMDLINE_LINUX_DEFAULT=... cryptdevice=UUID=<luks>:/dev/mapper/... root=...
#     (systemd-naming) or rd.luks.uuid=<luks>  (classic naming)
---
overwrite: true
always_use_defaults: true

kernel_params:
  - "nowatchdog"
  - "nvme_load=YES"

defaults:
  GRUB_TIMEOUT: "5"