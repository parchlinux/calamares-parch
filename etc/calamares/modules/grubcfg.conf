#
# grubcfg.conf — writes /etc/default/grub on the installed target (runs
# before the bootloader module).
#
# always_use_defaults MUST stay on so the module writes its computed
# kernel params (e.g. nowatchdog, nvme_load=YES) into GRUB_CMDLINE_LINUX_DEFAULT.
---
overwrite: true
always_use_defaults: true

kernel_params:
  - "nowatchdog"
  - "nvme_load=YES"

defaults:
  GRUB_TIMEOUT: "5"