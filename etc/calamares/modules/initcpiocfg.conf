#
# initcpiocfg.conf — configures /etc/mkinitcpio.conf on the target so the
# generated initramfs can unlock the LUKS root.
#
# The grubcfg module writes classic LUKS kernel params:
#     cryptdevice=UUID=<luks>:/dev/mapper/<name>  root=/dev/mapper/<name>
# For the initramfs to honor those, the classic `encrypt` hook MUST be in
# the image. Without it the root never opens and boot drops into the
# emergency shell ("can't mount root / root locked").
#
# We therefore prepend `encrypt` (classic). Do NOT use the systemd hook
# here unless grubcfg emits rd.luks.uuid instead of cryptdevice.
---
useSystemdHook: false