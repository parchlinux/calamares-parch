#
# Systuner kernel parameters and system responsiveness optimization module.
---
# Tuning profile.
# Available options:
#  - auto (automatically detects laptop/battery, low-memory, or desktop)
#  - desktop (balanced responsiveness for interactive desktop workloads)
#  - gaming (ultra-low stutter, optimized map count, eager writeback)
#  - laptop (battery-aware flush timers, balanced cache)
#  - low_mem (low memory footprint, aggressive cache control)
#  - server (throughput-oriented, larger writeback windows)
profile: "auto"

# Automatically detect HiDPI/Retina displays and configure display scaling
# for SDDM, /etc/environment (Qt/GTK), and KDE Plasma
hidpi_autoscale: true

# Set maximum battery charge threshold to 80% to prolong battery health on supported laptops
battery_longevity: true
battery_charge_limit: 80
