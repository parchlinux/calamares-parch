#Parch Linux Calamares settings configuration file

# Configuration file for Calamares
# Syntax is YAML 1.2
---

modules-search: [ local ]

instances:
- id:       copy_kernel
  module:   shellprocess
  config:   shellprocess_copy_kernel.conf
- id:       parchmkinitcpio
  module:   shellprocess
  config:   shellprocess-parch-mkinitcpio.conf
- id:       initramfs-build
  module:   shellprocess
  config:   shellprocess-initramfs-build.conf
- id:       crypt-root
  module:   shellprocess
  config:   shellprocess-crypt-root.conf
- id:       grub-mkconfig
  module:   shellprocess
  config:   shellprocess-grub-mkconfig.conf

- id:       parchsystemd
  module:   shellprocess
  config:   shellprocess-parch-systemd.conf
- id:       remove-livecd
  module:   shellprocess
  config:   shellprocess-remove-livecd.conf
sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - shellprocess@copy_kernel
  - shellprocess@parchmkinitcpio
  - initcpiocfg
  - removeuser
  - usersq
  - displaymanager
  - shellprocess@parchsystemd
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - shellprocess@initramfs-build
  - bootloader
  - grubcfg
  - shellprocess@crypt-root
  - shellprocess@grub-mkconfig
  - shellprocess@remove-livecd
  - umount
- show:
  - finished


branding: parchlinux

prompt-install: false

dont-chroot: false

disable-cancel: false

disable-cancel-during-exec: false